name: Update Modules on New Releases

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-submodule-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Update submodules to latest releases
        id: update
        run: |
          # Initialise un flag pour détecter les changements
          UPDATED=false

          # Parcourt chaque sous-module

            # Vérifie s'il y a une nouvelle release
          LATEST_RELEASE=$(git -C modules ls-remote --tags --sort="v:refname" origin | grep -E "refs/tags/v[0-9]+\.[0-9]+\.[0-9]+" | tail -n 1 | cut -d"/" -f3)

          if [ -n "$LATEST_RELEASE" ]; then
            echo "Checking submodule modules for new release: $LATEST_RELEASE"

            # Récupère la version actuelle
            CURRENT_COMMIT=$(git -C modules rev-parse HEAD)
            LATEST_COMMIT=$(git -C modules rev-parse $LATEST_RELEASE)

            if [ "$CURRENT_COMMIT" != "$LATEST_COMMIT" ]; then
              echo "New release found for modules: $LATEST_RELEASE"
              git -C modules checkout $LATEST_RELEASE
              UPDATED=true
            fi
          fi

          # Si des mises à jour ont été faites
          if [ "$UPDATED" = true ]; then
            git add .
            git commit -m "chore: update 'modules' to release $LATEST_RELEASE [skip ci]"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update submodules to latest releases"
          title: "chore: update submodules to latest releases"
          body: |
            This PR updates the submodule "modules".
          branch: "auto-update-submodule-module"
          base: main
          labels: "dependencies,automated"